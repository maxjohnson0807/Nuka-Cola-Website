<div class="card">
    <!-- Search Bar Section -->
    <form id="search-form" class="search-container">
        <input type="text" id="search-input" placeholder="Enter city name..." required autocomplete="off">
        <button type="submit">🔍</button>
    </form>

<div class="card">
    <!-- Date and Time Section -->
    <div class="date-container">
        <h2 id="date">Loading date...</h2>
        <p id="time">Loading time...</p>
    </div>

    <!-- Weather Section -->
    <div class="weather-container">
        <h1 id="location">New York</h1>
        <h3 id="temperature">--°F</h3>
        <p id="description">Fetching weather...</p>
    </div>
</div>

<!-- Link your JavaScript file at the bottom -->
<script src="script.js"></script>
