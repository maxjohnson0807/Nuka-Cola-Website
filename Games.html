<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuke Games — Ice Cold &amp; Bubbly Good!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Lilita+One&amp;family=Lobster&amp;family=Luckiest+Guy&amp;display=block" rel="stylesheet" />
    <link rel="stylesheet" href="MaxJohnsonStyleSheet.css" type="text/css" />
</head>
<body>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
        <div class="header-bar">
            <video
                class="header-bar__video"
                autoplay
                muted
                loop
                playsinline
                poster="HeaderBar2.png"
                aria-hidden="true"
            >
                <source src="MovingBarRed2.mp4" type="video/mp4" />
            </video>
            <a href="index.html">
                <img src="thisone5.png" alt="Nuka-Cola" />
            </a>
        </div>
        <nav class="nav-cream" aria-label="Main">
            <a href="index.html">HOME</a>
            <a href="index.html#buy">BUY NOW</a>
            <a href="index.html#story">OUR STORY</a>
            <a href="Games.html" aria-current="page">NUKE GAME</a>
        </nav>
    </header>

    <main class="game-page">
        <section class="game-select" aria-label="Choose a game">
            <h1 class="game-select__title">PICK A GAME</h1>
            <a class="game-select__item" href="Game1.html">
                <header class="content-card__header">
                    <h2>NUKA-COLA CATCH</h2>
                </header>
                <div class="game-select__media">
                    <img src="Regular.png" alt="Nuka-Cola Catch" width="520" height="640" decoding="async" />
                </div>
                <p class="game-hint">Move with the mouse or A/D. Catch falling flavors — avoid the nukes!</p>
            </a>
            <a class="game-select__item" href="Game2.html">
                <header class="content-card__header">
                    <h2>RADROACH BLAST</h2>
                </header>
                <div class="game-select__media">
                    <img src="zapper2.png" alt="Nuka Bottle Blaster" width="640" height="360" decoding="async" />
                </div>
                <p class="game-hint">Defend the last Nuka Cola Vending Machine from the Radroaches! Aim with the mouse and click or press space to fire!</p>
            </a>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-sparkles" aria-hidden="true"></div>
        <p class="footer-slogan">
            <span class="footer-star" aria-hidden="true">✦</span>
            BE A PART OF THE FUN!
            <span class="footer-star" aria-hidden="true">✦</span>
        </p>
    </footer>
</body>
</html>
